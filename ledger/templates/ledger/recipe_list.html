{% extends "ledger/base.html" %}

{% block page_title %}Recipes{% endblock %}

{% block content %}
<h2>Recipes</h2>

{% if user.is_authenticated %}
    <a href="{% url 'ledger:recipe-add' %}">+ Add New Recipe</a>
{% endif %}

<ul>
    {% for recipe in recipes %}
        <li>
            <a href="{{ recipe.get_absolute_url }}">
                {{ recipe.name }}
            </a>
        </li>
    {% endfor %}
</ul>
{% endblock %}
